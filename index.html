*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}

.footer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#a1a1a1}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#b5b5b5;margin:0 7px 2px}
