<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<meta name="description" content="Aither — Page not found">
<title>404 — Aither</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;background:#f7f7f8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
.page{width:min(680px,100%);text-align:center;animation:enter .55s ease both}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:18px;font-weight:650;letter-spacing:-.02em;margin-bottom:42px;color:#555}
.mark{width:27px;height:27px;border-radius:8px;background:#111;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.code{font-size:clamp(100px,24vw,190px);line-height:.82;letter-spacing:-.09em;font-weight:750;margin:0;color:#151515}
h1{font-size:clamp(24px,5vw,34px);letter-spacing:-.035em;margin:38px 0 12px;font-weight:700}p{font-size:17px;line-height:1.55;color:#737373;margin:0 auto;max-width:470px}
.actions{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.button{border:0;border-radius:12px;padding:12px 19px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s,background .18s}.primary{background:#111;color:#fff;box-shadow:0 5px 18px #00000014}.secondary{background:#e9e9eb;color:#222}.button:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000012}.button:active{transform:scale(.97)}
.secret-pad{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));width:120px;height:120px;opacity:0;touch-action:none;z-index:10}.secret-pad.active{opacity:1}.secret-pad svg{width:100%;height:100%;overflow:visible}.secret-pad circle{fill:transparent;stroke:transparent;stroke-width:2}.secret-pad.active circle{stroke:#00000010}.secret-pad .trace{fill:none;stroke:transparent;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.secret-pad.success{opacity:1}.secret-pad.success .trace{stroke:#111;stroke-dasharray:120;animation:draw .45s ease forwards}.unlock{display:none;position:fixed;left:50%;bottom:max(22px,calc(env(safe-area-inset-bottom) + 22px));transform:translateX(-50%);padding:11px 16px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:650;font-size:14px;box-shadow:0 8px 30px #00000022;z-index:20}.unlock.show{display:block;animation:pop .3s ease both}
.footer{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:#a1a1a1}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#b5b5b5;margin:0 7px 2px}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-color-scheme:dark){:root{color:#f5f5f7;background:#111}.brand{color:#aaa}.mark{background:#f5f5f7;color:#111}.code{color:#f5f5f7}p{color:#999}.primary{background:#f5f5f7;color:#111}.secondary{background:#252527;color:#eee}.footer{color:#666}.secret-pad.active circle{stroke:#ffffff12}.secret-pad.success .trace{stroke:#f5f5f7}.unlock{background:#f5f5f7;color:#111}}
@media(max-width:480px){body{padding:20px}.brand{margin-bottom:34px}.code{font-size:112px}h1{margin-top:30px}.actions{margin-top:24px}.button{width:100%;max-width:250px}.secret-pad{width:105px;height:105px;right:6px}}
</style>
</head>
<body>
<main class="page" aria-labelledby="title">
  <div class="brand"><span class="mark">A</span><span>Aither</span></div>
  <div class="code" aria-hidden="true">404</div>
  <h1 id="title">Page not found.</h1>
  <p>The page you’re looking for doesn’t exist, may have moved, or is temporarily unavailable.</p>
  <div class="actions"><a class="button primary" href="/">Go home</a><button class="button secondary" onclick="history.back()">Go back</button></div>
</main>
<div class="footer">Aither<span class="dot"></span>Nothing to see here</div>

<!-- Secret 3×3 touch pattern: 1 → 5 → 9 → 8 → 7 → 4 → 2 -->
<div class="secret-pad" id="secretPad" aria-hidden="true">
  <svg viewBox="0 0 120 120" role="presentation">
    <path class="trace" id="trace" d="M20 20 L60 60 L100 100 L60 100 L20 100 L20 60 L60 20"/>
    <circle cx="20" cy="20" r="12" data-dot="1"/><circle cx="60" cy="20" r="12" data-dot="2"/><circle cx="100" cy="20" r="12" data-dot="3"/>
    <circle cx="20" cy="60" r="12" data-dot="4"/><circle cx="60" cy="60" r="12" data-dot="5"/><circle cx="100" cy="60" r="12" data-dot="6"/>
    <circle cx="20" cy="100" r="12" data-dot="7"/><circle cx="60" cy="100" r="12" data-dot="8"/><circle cx="100" cy="100" r="12" data-dot="9"/>
  </svg>
</div>
<a class="unlock" id="unlock" href="/admin" aria-label="Open Aither Admin">Aither Admin</a>

<script>
// Hidden touch pattern. It is a UI easter egg, not authentication.
// Pattern: 1 → 5 → 9 → 8 → 7 → 4 → 2
const pad=document.getElementById('secretPad');
const unlock=document.getElementById('unlock');
const dots=[...pad.querySelectorAll('[data-dot]')];
const target=['1','5','9','8','7','4','2'];
let path=[],drawing=false;
const pointFor=e=>{const r=pad.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x,y}};
const hit=p=>dots.find(d=>{const r=d.getBoundingClientRect(),cx=r.left-pad.getBoundingClientRect().left+r.width/2,cy=r.top-pad.getBoundingClientRect().top+r.height/2;return Math.hypot(p.x-cx,p.y-cy)<20});
function start(e){drawing=true;path=[];pad.classList.add('active');pad.classList.remove('success');unlock.classList.remove('show');add(e)}
function add(e){if(!drawing)return;const p=pointFor(e),d=hit(p);if(d&&!path.includes(d.dataset.dot))path.push(d.dataset.dot)}
function end(){if(!drawing)return;drawing=false;if(path.join(',')===target.join(',')){pad.classList.add('success');unlock.classList.add('show');}else{pad.classList.remove('active')}}
pad.addEventListener('touchstart',start,{passive:true});pad.addEventListener('touchmove',add,{passive:true});pad.addEventListener('touchend',end,{passive:true});
pad.addEventListener('pointerdown',start);pad.addEventListener('pointermove',add);pad.addEventListener('pointerup',end);
</script>
</body>
</html>
