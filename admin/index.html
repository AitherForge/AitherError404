<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Aither Admin</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);padding:30px;border-radius:28px;background:#fff;box-shadow:0 20px 70px #00000012}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;margin-bottom:28px}.mark{width:32px;height:32px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:#888;margin:0 0 8px}.title{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}.muted{color:#777;line-height:1.5;margin:0 0 24px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #d8d8dc;border-radius:13px;font:inherit;background:#fafafa;outline:none}input:focus{border-color:#111;box-shadow:0 0 0 3px #0000000d}.login{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font:inherit;font-weight:700;cursor:pointer}.status{min-height:22px;margin-top:14px;font-size:13px;color:#777}.back{display:block;margin-top:18px;text-align:center;color:#777;text-decoration:none;font-size:13px}@media(prefers-color-scheme:dark){:root{background:#111;color:#f5f5f7}.card{background:#1c1c1e}.mark{background:#f5f5f7;color:#111}input{background:#252527;color:#fff;border-color:#444}.login{background:#f5f5f7;color:#111}.muted,.status,.back{color:#aaa}}
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <div class="brand"><span class="mark">A</span><span>Aither</span></div>
  <p class="eyebrow">PRIVATE AREA</p>
  <h1 class="title" id="title">Admin login</h1>
  <p class="muted">Sign in with your Aither Account to continue.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="login" type="submit">Sign in</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
  <a class="back" href="../">Return</a>
</main>
<script>
(() => {
  'use strict';
  // Keep the login hidden unless this tab reached it through the secret keypad.
  if (sessionStorage.getItem('aither_admin_unlocked') !== '1') {
    window.location.replace('../');
    return;
  }

  const BACKEND = 'https://aitherbackend.onrender.com';
  const form = document.getElementById('loginForm');
  const status = document.getElementById('status');

  form.addEventListener('submit', async event => {
    event.preventDefault();
    status.textContent = 'Signing in…';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      const response = await fetch(`${BACKEND}/api/auth/login`, {
        method:'POST',
        credentials:'include',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || 'Invalid email or password.');
      status.textContent = 'Signed in.';
      window.location.replace('../');
    } catch (error) {
      status.textContent = error.message || 'Unable to sign in.';
    }
  });
})();
</script>
</body>
</html>
