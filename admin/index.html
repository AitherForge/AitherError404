<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="robots" content="noindex,nofollow,noarchive"><title>Aither — Sign in</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17171a;background:#f5f5f7;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#fff 0,#f5f5f7 55%)}.card{width:min(440px,100%);padding:30px;border:1px solid #e5e5e8;border-radius:28px;background:#fff;box-shadow:0 24px 80px #00000012}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;margin-bottom:30px}.mark{width:36px;height:36px;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#888;margin:0 0 8px}.title{font-size:32px;letter-spacing:-.045em;margin:0 0 8px}.muted{color:#707075;line-height:1.5;margin:0 0 24px}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:14px;border:1px solid #d7d7dc;border-radius:13px;font:inherit;background:#fafafa;outline:none}.password-wrap{position:relative}.password-wrap input{padding-right:70px}.show{position:absolute;right:7px;top:7px;border:0;background:transparent;border-radius:9px;padding:7px;color:#666;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.login{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;background:#111;color:#fff;font:inherit;font-weight:750;cursor:pointer}.login:disabled{opacity:.55;cursor:wait}.status{min-height:22px;margin-top:14px;font-size:13px;color:#777}.status.bad{color:#b42318}.status.good{color:#18794e}.back{display:block;margin-top:18px;text-align:center;color:#777;text-decoration:none;font-size:13px}.hint{text-align:center;margin:20px 0 0;color:#999;font-size:11px}@media(prefers-color-scheme:dark){:root{background:#111;color:#f5f5f7;color-scheme:dark}body{background:#111}.card{background:#1c1c1e;border-color:#333}.mark{background:#f5f5f7;color:#111}input{background:#252527;color:#fff;border-color:#444}.login{background:#f5f5f7;color:#111}.muted,.status,.back,.hint{color:#aaa}.status.bad{color:#ff7b72}.status.good{color:#66d19e}}
</style></head><body><main class="card" aria-labelledby="title"><div class="brand"><span class="mark">A</span><span>Aither</span></div><p class="eyebrow">PRIVATE AREA</p><h1 class="title" id="title">Sign in</h1><p class="muted">Sign in with an Aither Account that has access. Your credentials are sent only to the configured Aither backend.</p><form id="loginForm" novalidate><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="show" id="showPassword" type="button">Show</button></div><button class="login" id="loginButton" type="submit">Sign in</button><div class="status" id="status" role="status" aria-live="polite"></div></form><a class="back" href="../">Return to AitherError404</a><p class="hint">Access is enforced by the backend.</p></main><script>(()=>{'use strict';if(sessionStorage.getItem('aither_admin_unlocked')!=='1'){location.replace('../');return}const API='https://aitherbackend.onrender.com',form=document.getElementById('loginForm'),status=document.getElementById('status'),button=document.getElementById('loginButton'),password=document.getElementById('password'),show=document.getElementById('showPassword');show.onclick=()=>{const v=password.type==='text';password.type=v?'password':'text';show.textContent=v?'Show':'Hide'};form.onsubmit=async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),pass=password.value;if(!email||!pass){status.className='status bad';status.textContent='Enter your email and password.';return}button.disabled=true;button.textContent='Signing in…';status.className='status';status.textContent='Checking credentials…';try{const r=await fetch(API+'/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Invalid email or password.');const check=await fetch(API+'/api/admin/overview',{credentials:'include'});if(!check.ok)throw Error(check.status===403?'This account does not have access.':'Service is unavailable.');status.className='status good';status.textContent='Access confirmed. Opening…';setTimeout(()=>location.replace('./dashboard.html'),250)}catch(err){status.className='status bad';status.textContent=err.message||'Unable to sign in.';button.disabled=false;button.textContent='Sign in'}}})();</script></body></html>
