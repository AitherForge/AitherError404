<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Aither — Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17171a}.card{width:min(440px,100%);padding:30px;border:1px solid #ddd;border-radius:24px;background:#fff;box-shadow:0 20px 60px #0001}.brand{font-weight:800;font-size:19px;margin-bottom:28px}.mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:9px;border-radius:11px;background:#111;color:#fff}.title{font-size:32px;margin:0 0 8px}.muted{color:#707075;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;font:inherit}.password{position:relative}.password input{padding-right:65px}.show{position:absolute;right:7px;top:7px;border:0;background:transparent;padding:7px;cursor:pointer}.login{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font:inherit;font-weight:700;cursor:pointer}.login:disabled{opacity:.5}.status{min-height:22px;margin-top:12px;font-size:13px}.bad{color:#b42318}.good{color:#18794e}.back{display:block;margin-top:18px;text-align:center;color:#777;text-decoration:none;font-size:13px}@media(prefers-color-scheme:dark){body{background:#111;color:#fff}.card{background:#1c1c1e;border-color:#333}input{background:#252527;color:#fff;border-color:#444}.login{background:#fff;color:#111}.muted,.back{color:#aaa}.mark{background:#fff;color:#111}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="mark">A</span>Aither</div>
  <h1 class="title">Sign in</h1>
  <p class="muted">Sign in with an account that has access.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <div class="password"><input id="password" type="password" autocomplete="current-password" required><button class="show" id="show" type="button">Show</button></div>
    <button class="login" id="login" type="submit">Sign in</button>
    <div class="status" id="status" aria-live="polite"></div>
  </form>
  <a class="back" href="../">Return</a>
</main>
<script>
const API='https://aitherbackend.onrender.com';
const $=id=>document.getElementById(id);
const status=(text,type='')=>{$('status').textContent=text;$('status').className='status '+type};

if(sessionStorage.getItem('aither_console_unlocked')!=='1') location.replace('../');

$('show').onclick=()=>{
  const input=$('password');
  input.type=input.type==='password'?'text':'password';
  $('show').textContent=input.type==='password'?'Show':'Hide';
};

$('loginForm').onsubmit=async event=>{
  event.preventDefault();
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){status('Enter your email and password.','bad');return;}

  $('login').disabled=true;
  $('login').textContent='Signing in…';
  status('Checking credentials…');

  try{
    const response=await fetch(API+'/api/auth/login',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.detail||'Invalid email or password.');

    const check=await fetch(API+'/api/admin/overview',{credentials:'include',cache:'no-store'});
    if(!check.ok) throw new Error(check.status===403?'This account does not have access.':'The backend is unavailable.');

    status('Access confirmed.','good');
    location.replace('./dashboard.html');
  }catch(error){
    status(error.message||'Unable to sign in.','bad');
    $('login').disabled=false;
    $('login').textContent='Sign in';
  }
};
</script>
</body>
</html>
