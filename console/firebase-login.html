<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Aither Admin — Firebase sign in</title><style>*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#f5f5f7;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);padding:32px;border:1px solid #dedee3;border-radius:28px;background:#fff;box-shadow:0 24px 80px #0001}.brand{font-weight:800;font-size:19px;margin-bottom:28px}.mark{display:inline-grid;place-items:center;width:40px;height:40px;margin-right:10px;border-radius:12px;background:#111;color:#fff}.title{font-size:32px;letter-spacing:-.04em;margin:10px 0}.muted{color:#707075;line-height:1.5}label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:13px;font:inherit}.login,.google{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}.login{background:#111;color:#fff}.google{background:#fff;border:1px solid #ccc}.status{min-height:22px;margin-top:12px;font-size:13px}.bad{color:#b42318}.good{color:#18794e}.hint{margin-top:18px;padding:12px;border:1px solid #e7e7ea;border-radius:12px;background:#fafafa;color:#777;font-size:12px;line-height:1.45}@media(prefers-color-scheme:dark){html,body{background:#111;color:#fff}.card{background:#1c1c1e;border-color:#333}.muted{color:#aaa}input{background:#252527;color:#fff;border-color:#444}.login{background:#fff;color:#111}.google,.hint{background:#252527;color:#aaa;border-color:#444}}</style></head><body><main class="card"><div class="brand"><span class="mark">A</span>Aither Admin</div><div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:#777">ADMIN AREA</div><h1 class="title">Admin sign in</h1><p class="muted">Use your Aither Firebase account. Admin access is still checked by the Aither backend.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="login" id="login">Sign in</button></form><button class="google" id="google">Continue with Google</button><div class="status" id="status" aria-live="polite"></div><div class="hint">Firebase handles the sign-in. The backend verifies the Firebase ID token and then checks the admin allowlist.</div></main><script type="module">import config from '../firebase-config.js';import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const auth=getAuth(initializeApp(config)),API='https://aitherbackendnew.onrender.com',$=id=>document.getElementById(id),status=(t,c='')=>{$('status').textContent=t;$('status').className='status '+c};async function exchange(user){const idToken=await user.getIdToken();const r=await fetch(API+'/api/auth/firebase',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({id_token:idToken})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Firebase authentication was rejected.');if(!d.session_token)throw Error('Backend did not return a session token.');sessionStorage.setItem('aither_admin_session_token',d.session_token);sessionStorage.setItem('aither_console_unlocked','1');const check=await fetch(API+'/api/admin/overview',{headers:{Authorization:'Bearer '+d.session_token},credentials:'include',cache:'no-store'});const cd=await check.json().catch(()=>({}));if(!check.ok){sessionStorage.removeItem('aither_admin_session_token');sessionStorage.removeItem('aither_console_unlocked');throw Error(cd.detail||'This account is not authorized for admin access.')}location.replace('./dashboard.html')}$('form').onsubmit=async e=>{e.preventDefault();$('login').disabled=true;status('Signing in…');try{const cred=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);status('Checking admin access…');await exchange(cred.user)}catch(err){status(err.message?.replace('Firebase: ','')||'Unable to sign in.','bad');$('login').disabled=false}};$('google').onclick=async()=>{status('Opening Google sign-in…');try{const cred=await signInWithPopup(auth,new GoogleAuthProvider());status('Checking admin access…');await exchange(cred.user)}catch(err){status(err.message?.replace('Firebase: ','')||'Unable to sign in.','bad')}};</script></body></html>
